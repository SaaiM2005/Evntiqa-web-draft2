# Local development: hot reload, API on :8000, Postgres on :5432.
services:
  db:
    ports:
      - "5432:5432"

  api:
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      ENV: dev
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
